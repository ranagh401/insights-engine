[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insights-engine"
version = "1.0.0"
description = "Config-driven insights engine: Power BI DAX KPIs, signal detection, why-analysis, and LLM narratives."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]",
    "pydantic[email]==2.11.7",
    "pydantic-settings==2.9.1",
    "sqlalchemy[asyncio]==2.0.41",
    "psycopg[binary,pool]",
    "psycopg2-binary",
    "asyncpg",
    "cachetools>=5.3.0",
    "httpx==0.28.1",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "azure-identity>=1.15.0",
    "openai>=1.51.0",
    "anthropic>=0.45.0",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "python-dateutil>=2.8.0",
    "apscheduler>=3.10.0",
    "structlog==25.4.0",
    "python-jose[cryptography]==3.5.0",
    "python-dotenv==1.1.0",
    "pyodbc>=5.1.0",
    "aio-pika>=9.3.0",
    "json-repair>=0.30.0",
]

[project.scripts]
insights-serve = "insights_engine.main:main"
pbi-engine-serve = "insights_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]
