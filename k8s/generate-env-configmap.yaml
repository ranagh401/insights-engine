  ONEPLATFORM_DATABRICKS__CATALOG: "{{ONEPLATFORM_DATABRICKS__CATALOG}}"
  ONEPLATFORM_DATABRICKS__SCHEMA_NAME: "{{ONEPLATFORM_DATABRICKS__SCHEMA_NAME}}"

  ONEPLATFORM_DATABASE__URL: "{{ONEPLATFORM_DATABASE__URL}}"
  ONEPLATFORM_DATABASE__SCHEMA: "{{ONEPLATFORM_DATABASE__SCHEMA}}"

  ONEPLATFORM_REDIS__URL: "{{ONEPLATFORM_REDIS__URL}}"

  ONEPLATFORM_JWT__JWT_SECRET: "{{ONEPLATFORM_JWT__JWT_SECRET}}"
  ONEPLATFORM_JWT__ALGORITHM: "{{ONEPLATFORM_JWT__ALGORITHM}}"
  ONEPLATFORM_JWT__ISSUER: "{{ONEPLATFORM_JWT__ISSUER}}"

  ONEPLATFORM_MESSAGE_BROKER__URL: "{{ONEPLATFORM_MESSAGE_BROKER__URL}}"

  # ── DAX Engine / Power BI Settings ──────────────────────────────
  AZURE_TENANT_ID: "{{AZURE_TENANT_ID}}"
  AZURE_CLIENT_ID: "{{AZURE_CLIENT_ID}}"
  PBI_WORKSPACE_ID: "{{PBI_WORKSPACE_ID}}"
  PBI_DATASET_ID: "{{PBI_DATASET_ID}}"
  DATE_TABLE_NAME: "{{DATE_TABLE_NAME}}"
  DATE_COLUMN_NAME: "{{DATE_COLUMN_NAME}}"
  PBI_MAX_CONCURRENT_QUERIES: "{{PBI_MAX_CONCURRENT_QUERIES}}"
  PBI_RETRY_MAX_ATTEMPTS: "{{PBI_RETRY_MAX_ATTEMPTS}}"
  PBI_DAX_READ_TIMEOUT_SECONDS: "{{PBI_DAX_READ_TIMEOUT_SECONDS}}"

  # ── Main-insight narrative LLM (Anthropic on Azure AI Foundry) ───
  INSIGHTS_ANTHROPIC_FOUNDRY__BASE_URL: "{{INSIGHTS_ANTHROPIC_FOUNDRY__BASE_URL}}"
  INSIGHTS_ANTHROPIC_FOUNDRY__DEPLOYMENT: "{{INSIGHTS_ANTHROPIC_FOUNDRY__DEPLOYMENT}}"
  INSIGHTS_ANTHROPIC_OPUS__BASE_URL: "{{INSIGHTS_ANTHROPIC_OPUS__BASE_URL}}"
  INSIGHTS_ANTHROPIC_OPUS__DEPLOYMENT: "{{INSIGHTS_ANTHROPIC_OPUS__DEPLOYMENT}}"
