apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-renuity-insights-portal-config
  namespace: {{NAMESPACE}}
data:

  ONEPLATFORM_APP__ENVIRONMENT: "{{ONEPLATFORM_ENVIRONMENT}}"
  ONEPLATFORM_APP__DEBUG: "{{ONEPLATFORM_DEBUG}}"

  ONEPLATFORM_SERVICE__NAME: "{{ONEPLATFORM_SERVICE__NAME}}"
  ONEPLATFORM_SERVICE__VERSION: "{{ONEPLATFORM_SERVICE__VERSION}}"
  ONEPLATFORM_SERVICE__PORT: "{{ONEPLATFORM_SERVICE__PORT}}"
  ONEPLATFORM_SERVICE__GRPC_PORT: "{{ONEPLATFORM_SERVICE__GRPC_PORT}}"

  ONEPLATFORM_SQLSERVER__CONN_STR: "{{ONEPLATFORM_SQLSERVER__CONN_STR}}"

  ONEPLATFORM_OPENAI__API_KEY: "{{ONEPLATFORM_OPENAI__API_KEY}}"
  ONEPLATFORM_OPENAI__ENDPOINT: "{{ONEPLATFORM_OPENAI__ENDPOINT}}"
  ONEPLATFORM_OPENAI__API_VERSION: "{{ONEPLATFORM_OPENAI__API_VERSION}}"
  ONEPLATFORM_OPENAI__DEPLOYMENT: "{{ONEPLATFORM_OPENAI__DEPLOYMENT}}"
  ONEPLATFORM_OPENAI__TEMPERATURE: "{{ONEPLATFORM_OPENAI__TEMPERATURE}}"

  ONEPLATFORM_DATABRICKS__HOST: "{{ONEPLATFORM_DATABRICKS__HOST}}"
