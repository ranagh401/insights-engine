name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Lint (ruff, advisory)
        # Advisory only for now: the codebase has pre-existing lint findings.
        # Remove continue-on-error once they are cleaned up to make lint blocking.
        continue-on-error: true
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ -v
